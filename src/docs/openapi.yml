openapi: 3.0.0
info:
  title: Wilayah Public API
  version: "1.0.0"
  description: API wilayah Indonesia.
servers:
  - url: http://localhost:3000/api/v1

paths:
  /provinces:
    get:
      summary: Get list provinces
      responses:
        "200":
          description: OK

  /provinces/{id}:
    get:
      summary: Get province by ID
      parameters:
        - name: id
          in: path
          required: true
      responses:
        "200":
          description: OK
        "404":
          description: Not found
